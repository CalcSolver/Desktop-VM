<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeDOS WebAssembly VM</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 16px;
      font-size: 1.5rem;
    }

    /* Container crops out the controls bar */
    .vm-container {
      width: 640px;
      height: 280px;
      overflow: hidden;
      border: 2px solid #333333;
      border-radius: 4px;
      background: #000000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .vm-container iframe {
      width: 650px;
      height: 420px;
      border: none;
      position: absolute;
      top: -130px;
      left: 0;
    }

    .instructions {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h1>FreeDOS WebAssembly VM</h1>

  <div class="vm-container">
    <iframe src="https://copy.sh/v86/?profile=freedos" allowfullscreen></iframe>
  </div>

  <p class="instructions">Click inside the VM frame to start controlling FreeDOS.</p>

</body>
</html>
