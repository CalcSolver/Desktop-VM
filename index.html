<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Native WebAssembly VM</title>
  <style>
    body { margin: 0; background: #121212; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    #screen_container { border: 2px solid #333; background: #000; width: 640px; height: 400px; }
  </style>
  <script src="./libv86.js"></script>
</head>
<body>
  <div id="screen_container"></div>
  <script>
    window.addEventListener("DOMContentLoaded", function() {
      new V86Starter({
        wasm_path: "./v86.wasm",
        memory_size: 64 * 1024 * 1024,
        vga_memory_size: 4 * 1024 * 1024,
        screen_container: document.getElementById("screen_container"),
        bios: { url: "./seabios.bin" },
        fda: { url: "./freedos722.img" },
        autostart: true
      });
    });
  </script>
</body>
</html>
