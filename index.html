<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeDOS WebAssembly VM</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 16px;
      font-size: 1.5rem;
    }

    #screen_container {
      border: 2px solid #333333;
      border-radius: 4px;
      background: #000000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      width: 640px;
      height: 400px;
    }

    canvas {
      display: block;
    }

    .instructions {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
  <script src="./libv86.js"></script>
</head>
<body>

  <h1>FreeDOS WebAssembly VM</h1>
  
  <div id="screen_container"></div>

  <p class="instructions">Click inside the screen to capture keyboard controls.</p>

  <script>
    window.addEventListener("DOMContentLoaded", function() {
      var emulator = new V86Starter({
        wasm_path: "./v86.wasm",
        memory_size: 64 * 1024 * 1024,
        vga_memory_size: 4 * 1024 * 1024,
        screen_container: document.getElementById("screen_container"),
        bios: {
          url: "./seabios.bin",
        },
        fda: {
          url: "./freedos722.img",
        },
        autostart: true,
      });
    });
  </script>

</body>
</html>
