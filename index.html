<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser VM Test</title>
  <style>
    body {
      margin: 0;
      background-color: #121212;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #screen_container {
      border: 2px solid #333;
      background: #000;
      width: 640px;
      height: 400px;
    }
    canvas { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/v86@latest/build/libv86.js"></script>
</head>
<body>

  <h1>Browser VM Test</h1>
  <div id="screen_container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", function() {
      var emulator = new V86Starter({
        wasm_path: "https://cdn.jsdelivr.net/npm/v86@latest/build/v86.wasm",
        memory_size: 32 * 1024 * 1024,
        vga_memory_size: 2 * 1024 * 1024,
        screen_container: document.getElementById("screen_container"),
        bios: {
          url: "https://cdn.jsdelivr.net/npm/v86@latest/bios/seabios.bin",
        },
        vga_bios: {
          url: "https://cdn.jsdelivr.net/npm/v86@latest/bios/vgabios.bin",
        },
        // Direct bootable test OS
        bzimage: {
          url: "https://cdn.jsdelivr.net/gh/copy/v86@master/images/buildroot-bzImage.bin",
        },
        autostart: true,
      });
    });
  </script>

</body>
</html>
