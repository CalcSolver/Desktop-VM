<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeDOS WebAssembly VM</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 16px;
      font-size: 1.5rem;
    }

    #screen_container {
      border: 2px solid #333333;
      border-radius: 4px;
      background: #000000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      position: relative;
    }

    #screen_container canvas {
      display: block;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #00ff00;
      font-family: monospace;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.8);
      padding: 4px 8px;
      pointer-events: none;
    }

    .instructions {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
  <!-- Main v86 Library -->
  <script src="https://copy.sh/v86/build/libv86.js"></script>
</head>
<body>

  <h1>FreeDOS WebAssembly VM</h1>
  
  <div id="screen_container">
    <div id="status">Loading VM engine...</div>
  </div>

  <p class="instructions">Click inside the screen to capture keyboard controls.</p>

  <script>
    window.addEventListener("load", function() {
      var status = document.getElementById("status");

      try {
        var emulator = new V86Starter({
          wasm_path: "https://copy.sh/v86/build/v86.wasm",
          memory_size: 64 * 1024 * 1024,
          vga_memory_size: 4 * 1024 * 1024,
          screen_container: document.getElementById("screen_container"),
          bios: {
            url: "https://copy.sh/v86/bios/seabios.bin",
          },
          vga_bios: {
            url: "https://copy.sh/v86/bios/vgabios.bin",
          },
          fda: {
            url: "./freedos722.img",
          },
          autostart: true,
        });

        emulator.add_listener("emulator-ready", function() {
          status.innerText = "Booting FreeDOS...";
          setTimeout(function() {
            status.style.display = "none";
          }, 3000);
        });

      } catch (err) {
        status.style.color = "#ff4444";
        status.innerText = "Error: " + err.message;
      }
    });
  </script>

</body>
</html>
