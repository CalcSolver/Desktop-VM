<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser DOS Engine</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #121212;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 16px;
      font-size: 1.5rem;
    }

    #dos {
      width: 640px;
      height: 400px;
      border: 2px solid #333;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
  </style>
  <!-- JS-DOS CDN -->
  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
</head>
<body>

  <h1>Browser DOS Engine</h1>
  <div id="dos"></div>

  <script>
    Dos(document.getElementById("dos"), {
      style: "fill"
    }).then((dos) => {
      dos.run("https://cdn.dos.zone/custom/dos/digger.zip");
    });
  </script>

</body>
</html>
