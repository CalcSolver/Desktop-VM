<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser VM</title>
  <style>
    body {
      margin: 0;
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #screen_container {
      border: 2px solid #444;
      background: #000;
      cursor: pointer;
    }
    /* Style for canvas rendered by v86 */
    #screen_container canvas {
      display: block;
    }
  </style>
  <!-- Load v86 library from CDN -->
  <script src="https://unpkg.com/v86/build/libv86.js"></script>
</head>
<body>

  <h2>Browser Windows VM</h2>
  <div id="screen_container">
    <div style="white-space: pre; font-family: monospace;">Loading VM...</div>
  </div>

  <script>
    window.onload = function() {
      var emulator = new V86({
        // Path to v86 WebAssembly binary hosted on CDN
        wasm_path: "https://unpkg.com/v86/build/v86.wasm",
        
        // RAM allocated to the VM (in Bytes: 128MB = 128 * 1024 * 1024)
        memory_size: 128 * 1024 * 1024,
        vga_memory_size: 8 * 1024 * 1024,
        
        // Target container for visual output
        screen_container: document.getElementById("screen_container"),
        
        // BIOS files loaded directly from CDN
        bios: {
          url: "https://unpkg.com/v86/bios/seabios.bin",
        },
        vga_bios: {
          url: "https://unpkg.com/v86/bios/vgabios.bin",
        },
        
        // Path to your disk image (relative to index.html)
        hda: {
          url: "./windows98.img",
        },
        
        autostart: true,
      });
    };
  </script>

</body>
</html>
