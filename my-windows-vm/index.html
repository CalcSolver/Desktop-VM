<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeDOS WebAssembly VM</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 16px;
      font-size: 1.5rem;
    }

    #screen_container {
      border: 2px solid #333333;
      border-radius: 4px;
      background: #000000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }

    #screen_container canvas {
      display: block;
    }

    .instructions {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
  <script src="https://unpkg.com/v86/build/libv86.js"></script>
</head>
<body>

  <h1>FreeDOS WebAssembly VM</h1>
  
  <div id="screen_container">
    <div style="white-space: pre; font-family: monospace; padding: 20px; color: #00ff00;">Booting FreeDOS...</div>
  </div>

  <p class="instructions">Click inside the screen to control the VM.</p>

  <script>
    window.onload = function() {
      var emulator = new V86({
        wasm_path: "https://unpkg.com/v86/build/v86.wasm",
        memory_size: 64 * 1024 * 1024,
        vga_memory_size: 4 * 1024 * 1024,
        screen_container: document.getElementById("screen_container"),
        bios: {
          url: "https://unpkg.com/v86/bios/seabios.bin",
        },
        vga_bios: {
          url: "https://unpkg.com/v86/bios/vgabios.bin",
        },
        
        // Loads lightweight FreeDOS floppy image directly from v86 repository
        fda: {
          url: "https://copy.sh/v86/images/freedos720.img",
        },
        
        autostart: true,
      });
    };
  </script>

</body>
</html>
